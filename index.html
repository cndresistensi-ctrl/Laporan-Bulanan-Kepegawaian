{f:"LAPORAN_BULANAN_OKTOBER_26_DIVISI_MEDIA___IT.pdf",t:"Laporan Bulanan Divisi Media & IT",u:"Media & IT",tp:"Teks digital",st:"warn",
isi:"Laporan 1–31 Oktober 2026 oleh Tim Media & IT (tertanggal 4 November 2026) dalam tiga bagian: publikasi dan live streaming, dokumentasi dan editing video, serta desain grafis.",
an:["Live streaming pengajian ba'da Subuh berjalan konsisten sepanjang 31 hari melalui YouTube dan TikTok.",
"Ada 2 siaran event: Tasmi' Al-Qur'an 5 Juz Bil Ghaib (10 Okt) dan Live TikTok Hari Santri.",
"Dokumentasi dan editing video berjumlah 6 butir. Empat di antaranya (10, 12, 19, 22 Okt) berkaitan dengan Tasmi' yang sama, sedangkan 2 lainnya adalah konten PSB 2027/2028 (5 Okt) dan seremoni keberangkatan ke Mesir (10 Okt).",
"Desain grafis ada 3 pamflet: Hari Santri Nasional (21 Okt), dokumentasi Tasmi' (18 Okt), dan dokumentasi foto Hari Santri (24 Okt).",
"Temuan data: Live Hari Santri bertanggal 19 September (di luar periode, padahal Hari Santri 22 Oktober) dan ada satu butir kosong di bagian II.",
"Laporan hanya berupa daftar kegiatan. Belum ada capaian terukur seperti jumlah penonton, jangkauan, atau durasi tayang, dan belum ada nama pelaksana per tugas."],
ch:[{k:"bar",t:"Jumlah output non-rutin",it:[["Dokumentasi/editing video",6],["Desain pamflet",3],["Siaran event",2]]}],
tl:["Koreksi tanggal live Hari Santri.","Tambahkan metrik YouTube/TikTok dan target bulanan agar kinerja dapat dievaluasi."]},
{f:"REKAP_ABSENSI_KARYAWAN_KEBERSIHAN_DAN_PERLENGKAPAN_BULAN_OKTOBER_2026_1.pdf",t:"Rekap Absensi Karyawan Kebersihan, Satpam, dan Dapur",u:"Kebersihan · Satpam · Dapur",tp:"Teks + data ceklok",st:"warn",
isi:"Rekap tiga unit dengan supervisor Ja'far Sodiq (kebersihan, 26 hari kerja), Candra Saputra (satpam, 31 hari), dan Pak Amin (dapur, 31 hari), ditambah data mesin ceklok kebersihan 1–31 Oktober.",
an:["Pak Lan masuk 26 dari 26 hari (100%).","Pak Lukman masuk 23 hari, izin 1 hari, dan digantikan Kang Sodik 2 hari (kehadiran sendiri 88,5%).","Pak Wahid masuk 24 hari, izin 2 hari (kehadiran 92,3%), serta tidak ceklok 3 kali.",
"Mesin ceklok Pak Wahid mencatat 21 hari; 19 di antaranya datang setelah 07.30 (jam kerja 07.30–16.00), paling lambat 08.30.",
"Pak Lan mayoritas datang 06.23–07.30; sekitar 5 hari melewati 07.30.",
"Pak Lukman tidak memiliki data ceklok sama sekali walau tercatat masuk 23 hari, sehingga kehadirannya hanya berdasar ceklis manual.",
"Satpam (Irsyad, Pak Haqi) dan dapur (Pak Amin, Bu Anis) masing-masing 31/31 hari tanpa sakit, izin, atau alpa."],
ch:[{k:"bar",t:"Kehadiran staf kebersihan (% dari 26 hari kerja)",u:"%",it:[["Pak Lan",100],["Pak Wahid",92.3],["Pak Lukman",88.5]]}],
tl:["Pasang/registrasi ulang ceklok untuk Pak Lukman.","Tegur keterlambatan Pak Wahid dan evaluasi jam kerja."]},
{f:"REKAP_BISYAROH_SMP_PERIODE_OKTOBER_2026.pdf",t:"Presensi, Cuti, Struktur, dan Honor Bimbel TKA SMP",u:"SMP",tp:"Teks digital",st:"bad",
isi:"Empat bagian: rekap presensi guru SMP (22 guru), rekap cuti (14 guru), daftar wali kelas dan wakil bidang, serta honor bimbel TKA bulan Oktober.",

<h4>TINDAK LANJUT</h4><ul>${d.tl.map(x=>`<li>${x}</li>`).join("")}</ul>${SIGN()}<div class="pn">Berkas ${no} · Lembar B</div></div></article>`}
function buildNav(docs){$("nv").innerHTML=`<div class="nvg"><button class="nb" data-k="r"><span>RINGKASAN</span><b>Semua berkas</b><small>Cover, grafik, rekomendasi</small></button>${docs.map((d,i)=>`<button class="nb" data-k="${i}"><span>BERKAS ${i+1}${SG[cur+"-"+i]?" ✓":""}</span><b>${d.u}</b><small>${d.f.slice(0,24)}…</small></button>`).join("")}</div>`;
 $("nv").querySelectorAll(".nb").forEach(b=>b.onclick=()=>{SEL=b.dataset.k;applyView();scrollTo(0,0)})}
function applyView(){document.querySelectorAll(".vw").forEach(v=>v.hidden=v.dataset.v!=SEL);$("cover").style.display=SEL=="r"?"":"none";
 document.querySelectorAll(".nb").forEach(b=>b.classList.toggle("on",b.dataset.k==SEL));
 $("pb").textContent=SEL=="r"?"Cetak ringkasan (A4)":"Cetak berkas "+(+SEL+1)+" (A4)";
 $("sb").style.display=SEL=="r"?"none":"";$("sb").textContent=SG[cur+"-"+SEL]?"Batalkan tanda tangan":"Tandai sudah ditandatangani"}
function toggleSign(){const k=cur+"-"+SEL;SG[k]=!SG[k];try{localStorage.setItem("monevSG",JSON.stringify(SG))}catch(e){}render()}
const goto=i=>{SEL=String(i);applyView();scrollTo(0,0);return false};
function render(){
 const d=STORE[cur],k=sum2(d),keys=Object.keys(STORE).sort(),pk=keys[keys.indexOf(cur)-1],pv=pk?sum2(STORE[pk]):null,docs=d.docs||[];
 $("bln").innerHTML=keys.map(x=>`<option value="${x}"${x==cur?" selected":""}>${STORE[x].bulan}</option>`).join("");
 const rank=k.u.filter(x=>x.t>0).sort((a,b)=>b.t-a.t),izl=k.u.filter(x=>x.c>0).sort((a,b)=>b.c-a.c),fl=rank.filter(x=>x.t>=10).map(x=>x.n);
 const uT=["SMP","MA","Struktural"].map(u=>{const r=d.staff.filter(s=>s[0]==u);return[u,r.length,sum(r,s=>s[3]),sum(r,s=>s[5])]});
 const ngU=[...new Set(d.nonguru.map(x=>x[0]))].map(u=>{const r=d.nonguru.filter(x=>x[0]==u);return[u,r.length,sum(r,x=>x[2]),sum(r,x=>x[3]),sum(r,x=>x[4]),sum(r,x=>x[5])]});
 const m=d.media;
 $("rpt").innerHTML=`<div class="vw" data-v="r">
<section><h2>Ringkasan Eksekutif – ${d.bulan}</h2><div class="kpi">
<div><b>${k.orang}</b><small>Pegawai &amp; guru terpantau</small></div>
<div><b>${k.telat}</b><small>Kejadian terlambat</small><br>${delta(k.telat,pv&&pv.telat)}</div>
<div><b>${k.izin}</b><small>Hari izin/cuti</small><br>${delta(k.izin,pv&&pv.izin)}</div>
<div><b>${k.hadir.toFixed(1)}%</b><small>Kehadiran staf non-guru</small></div>
<div><b>${rp(k.honor)}</b><small>Honor bimbel &amp; kelas sore</small></div></div>
<h4>Temuan utama</h4><ul>
<li>Keterlambatan tertinggi: ${rank.slice(0,5).map(x=>x.n+" ("+x.t+"x)").join(", ")}; ${fl.length} orang mencapai ≥10 kali.</li>
<li>Izin/cuti terpanjang: ${izl.slice(0,4).map(x=>x.n+" ("+x.c+" hari)").join(", ")}.</li>
<li>Staf non-guru tanpa alpa atau sakit; Pak Wahid izin 2 hari dan 3x tidak ceklok.</li>
<li>Satpam tercatat aman dan dapur lancar, namun kolom kondisi satpam kosong sejak 20 Oktober.</li>
<li>Media &amp; IT: live rutin ${m.live} hari, ${m.event} siaran event, ${m.dok} dokumentasi video, ${m.desain} desain pamflet.</li></ul>
<div class="g2"><figure><figcaption>Keterlambatan per unit (kali)</figcaption>${dn(uT.map(r=>[r[0],r[2]]))}</figure>
<figure><figcaption>Hari izin/cuti per unit</figcaption>${dn(uT.map(r=>[r[0],r[3]]))}</figure></div>
<div class="g2"><figure><figcaption>10 terlambat terbanyak (kali)</figcaption>${hb(rank.slice(0,10).map(x=>[x.n,x.t]),"",10)}</figure>
<figure><figcaption>8 izin/cuti terpanjang (hari)</figcaption>${hb(izl.slice(0,8).map(x=>[x.n,x.c]),"",10)}</figure></div>
<div class="tw"><table><tr><th>Unit pengajar/struktural</th><th class="n">Orang</th><th class="n">Telat</th><th class="n">Hari izin</th></tr>${uT.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n">${r[2]}</td><td class="n">${r[3]}</td></tr>`).join("")}</table></div><br>
<div class="tw"><table><tr><th>Unit non-guru</th><th class="n">Orang</th><th class="n">Hari kerja</th><th class="n">Hadir</th><th class="n">Izin</th><th class="n">Alpa</th></tr>${ngU.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td class="n">${v}</td>`).join("")}</tr>`).join("")}</table></div>
<p class="mut">Ambang status: terlambat ≥10 kali perlu pembinaan (merah). Orang dengan peran ganda dihitung sekali (nilai tertinggi).</p></section>
<section><h2>Daftar Berkas dan Status</h2><div class="tw"><table><tr><th>No</th><th>Berkas</th><th>Lembaga</th><th>Status</th><th>Pengesahan</th></tr>${docs.map((x,i)=>`<tr><td>${i+1}</td><td><a href="#" onclick="return goto(${i})">${x.t}</a></td><td>${x.u}</td><td><span class="tag ${x.st}">${SS[x.st]}</span></td><td>${SG[cur+"-"+i]?"Sudah":"Menunggu"}</td></tr>`).join("")}</table></div></section>
<section class="pb"><h2>Rekomendasi</h2><ol>
<li>Pembinaan guru dengan keterlambatan ≥10 kali: ${fl.join(", ")||"tidak ada"}; evaluasi ulang bulan depan.</li>
<li>Verifikasi izin panjang dan samakan rekap cuti dengan presensi; siapkan mekanisme guru pengganti.</li>
<li>Ganti ceklis, buku tamu, dan absensi tulisan tangan dengan formulir digital seragam agar dapat diimpor tiap bulan.</li>
<li>Gunakan satu nama baku per orang di semua unit dan lengkapi data ceklok yang kosong.</li></ol>
<h2 style="margin-top:18px">Catatan Kualitas Data</h2><ul>${d.catatan.map(c=>`<li>${c}</li>`).join("")}</ul>
${SIGN()}</section></div>${docs.map((x,i)=>`<div class="vw" data-v="${i}">${docH(x,i)}</div>`).join("")}`;
 $("per").textContent="Periode "+d.bulan;$("clg").src=LOGO;buildNav(docs);applyView();$("tgl").textContent=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}
$("lgo").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{LOGO=r.result;try{localStorage.setItem("monevLogo",LOGO)}catch(x){}render()};r.readAsDataURL(f)};
$("bln").onchange=e=>{cur=e.target.value;render()};
$("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.key||!d.staff)throw 0;STORE[d.key]=d;cur=d.key;try{localStorage.setItem("monev",JSON.stringify(STORE))}catch(x){}render()}catch(x){alert("File tidak valid. Gunakan JSON hasil 'Unduh data' sebagai templat.")}})};
render();
</script></body></html>
